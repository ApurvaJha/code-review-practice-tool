<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Interview Practice Suite</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --text-color: #d4d4d4;
            --panel-bg: #252526;
            --border: #3c3c3c;
            --accent: #007acc;
            --success: #4CAF50;
            --danger: #f44336;
            --warning: #ff9800;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header a {
            color: var(--accent);
            text-decoration: none;
        }
        .header a:hover {
            text-decoration: underline;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.95em;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            color: var(--accent);
            font-weight: 600;
            position: sticky;
            top: 0;
            background: var(--panel-bg);
        }
        tr:hover {
            background-color: #2a2d2e;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            color: white;
            font-weight: bold;
        }
        .badge-cr { background-color: #555; }
        .badge-pt { background-color: #007acc; }
    </style>
</head>
<body>
<div class="header">
    <h2>Analytics Dashboard</h2>
    <a href="index.html">&larr; Back to Suite Portal</a>
</div>

<div class="dashboard-grid">
    <!-- Chart Panel -->
    <div class="panel">
        <h3 style="margin-top: 0; color: var(--accent);">Score Progression Over Time</h3>
        <div style="position: relative; height: 300px; width: 100%;">
            <canvas id="scoreChart"></canvas>
        </div>
    </div>

    <!-- History Table Panel -->
    <div class="panel">
        <h3 style="margin-top: 0; color: var(--accent);">Session History</h3>
        <table>
            <thead>
            <tr>
                <th>Date & Time</th>
                <th>Module</th>
                <th>Context / Target</th>
                <th>Focus Area / Competency</th>
                <th>Score</th>
                <th>Signal</th>
            </tr>
            </thead>
            <tbody id="history-tbody">
            <tr><td colspan="6" style="text-align: center; padding: 20px;">Loading history...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function loadHistory() {
        try {
            // Fetch the unified session list from the existing ReviewController endpoint
            const res = await fetch('/api/sessions');
            const sessions = await res.json();

            const tbody = document.getElementById('history-tbody');
            tbody.innerHTML = '';

            if (sessions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">No sessions recorded yet. Complete a module to see analytics.</td></tr>';
                return;
            }

            // Data arrays for Chart.js
            // Reverse the array so the chart reads left-to-right chronologically
            const chronologicalSessions = [...sessions].reverse();
            const labels = [];
            const crScores = [];
            const ptScores = [];

            // 1. Populate the Table (using the original descending order)
            sessions.forEach(session => {
                const tr = document.createElement('tr');

                // Format Timestamp cleanly
                const dateObj = session.timestamp && session.timestamp !== "Unknown Time"
                    ? new Date(session.timestamp.replace(' ', 'T'))
                    : new Date(parseInt(session.id));
                const dateStr = isNaN(dateObj) ? "Unknown Date" :
                    `${dateObj.toLocaleDateString()} ${dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;

                if (session.moduleType === 'PRODUCT_THINKING') {
                    // Render EM Product Row
                    tr.innerHTML = `
                            <td>${dateStr}</td>
                            <td><span class="badge badge-pt">EM Product</span></td>
                            <td>${session.title || 'Manager Scenario'}</td>
                            <td>${session.competency || 'N/A'}</td>
                            <td><strong>${session.score || 0}/100</strong></td>
                            <td>${session.hireSignal || 'Pending'}</td>
                        `;
                } else {
                    // Render Legacy Code Review Row
                    const focusStr = (session.focusAreas && session.focusAreas.length > 0)
                        ? session.focusAreas.join(', ')
                        : 'Mixed';

                    tr.innerHTML = `
                            <td>${dateStr}</td>
                            <td><span class="badge badge-cr">Code Review</span></td>
                            <td>${session.language || 'Unknown'} (${session.level || 'Unknown'})</td>
                            <td>${focusStr}</td>
                            <td><strong>${session.score || 0}/100</strong></td>
                            <td>${session.hireSignal || 'Pending'}</td>
                        `;
                }
                tbody.appendChild(tr);
            });

            // 2. Populate the Chart (using chronological order)
            chronologicalSessions.forEach(session => {
                const dateObj = session.timestamp && session.timestamp !== "Unknown Time"
                    ? new Date(session.timestamp.replace(' ', 'T'))
                    : new Date(parseInt(session.id));

                const label = isNaN(dateObj) ? "Unknown" : dateObj.toLocaleDateString();
                labels.push(label);

                // Separate the scores into two distinct datasets based on moduleType
                if (session.moduleType === 'PRODUCT_THINKING') {
                    ptScores.push(session.score || 0);
                    crScores.push(null); // Keep alignment for spanGaps
                } else {
                    crScores.push(session.score || 0);
                    ptScores.push(null); // Keep alignment for spanGaps
                }
            });

            renderChart(labels, crScores, ptScores);

        } catch (err) {
            console.error("Error loading history:", err);
            document.getElementById('history-tbody').innerHTML = `
                    <tr><td colspan="6" style="text-align: center; color: var(--danger); padding: 20px;">
                        Failed to load history data. Make sure the backend is running.
                    </td></tr>
                `;
        }
    }

    function renderChart(labels, crScores, ptScores) {
        const ctx = document.getElementById('scoreChart').getContext('2d');

        // Chart.js Configuration
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Code Review Score',
                        data: crScores,
                        borderColor: '#888',
                        backgroundColor: '#888',
                        borderWidth: 2,
                        spanGaps: true, // Connect lines across null values
                        tension: 0.3,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    },
                    {
                        label: 'Product Thinking Score',
                        data: ptScores,
                        borderColor: '#007acc',
                        backgroundColor: '#007acc',
                        borderWidth: 2,
                        spanGaps: true, // Connect lines across null values
                        tension: 0.3,
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100,
                        grid: { color: '#3c3c3c' },
                        ticks: { color: '#d4d4d4' }
                    },
                    x: {
                        grid: { color: '#3c3c3c' },
                        ticks: { color: '#d4d4d4' }
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: '#d4d4d4', font: { size: 14 } }
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                    }
                }
            }
        });
    }

    // Initialize script on page load
    loadHistory();
</script>
</body>
</html>
